services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:5000"
      - "${SF_AUTH_SOCKET_PORT:-8889}:8888"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:5000
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
