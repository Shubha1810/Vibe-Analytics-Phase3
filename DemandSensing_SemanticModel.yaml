  - name: FACT_PROMOTIONS_to_DIM_STORE
    left_table: FACT_PROMOTIONS
    right_table: DIM_STORE
    relationship_columns:
      - left_column: STORE_ID
        right_column: STORE_ID


# =============================================================================
# VERIFIED QUERIES (Grounding examples for Cortex Analyst)
# =============================================================================
verified_queries:

  - name: verified_query_01

    question: What are total net sales by department for the current fiscal year?
    sql: |
      SELECT DEPARTMENT, SUM(NET_SALES_AMT) AS total_net_sales
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY
      WHERE FISCAL_YEAR = 2026 AND SCENARIO_ID IS NULL
      GROUP BY DEPARTMENT
      ORDER BY total_net_sales DESC

  - name: verified_query_02

    question: Which SKUs had the most stockout days last month?
    sql: |
      SELECT f.SKU_ID, p.PRODUCT_NAME, p.CATEGORY_L3,
             COUNT(*) AS stockout_days
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY f
      JOIN DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_PRODUCT p ON f.SKU_ID = p.SKU_ID
      WHERE f.STOCKOUT_FLAG = TRUE
        AND f.TRANSACTION_DATE >= DATEADD('month', -1, CURRENT_DATE())
        AND f.SCENARIO_ID IS NULL
      GROUP BY f.SKU_ID, p.PRODUCT_NAME, p.CATEGORY_L3
      ORDER BY stockout_days DESC
      LIMIT 20

  - name: verified_query_03

    question: What is the forecast accuracy (MAPE) by region?
    sql: |
      SELECT REGION, AVG(ABS_PCT_ERROR) AS mape
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_FORECAST
      WHERE FORECAST_TYPE = 'actuals_vs_forecast'
        AND FISCAL_YEAR = 2026
      GROUP BY REGION
      ORDER BY mape ASC

  - name: verified_query_04

    question: Show me the top 10 promotions by ROI
    sql: |
      SELECT fp.PROMO_ID, fp.PROMO_NAME, fp.PROMO_TYPE, fp.PROMO_ROI,
             fp.PROMO_LIFT_PCT, fp.PROMO_UNITS_INCREMENTAL,
             p.PRODUCT_NAME, p.CATEGORY_L3
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_PROMOTIONS fp
      JOIN DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_PRODUCT p ON fp.SKU_ID = p.SKU_ID
      ORDER BY fp.PROMO_ROI DESC
      LIMIT 10

  - name: verified_query_05

    question: What is the OTIF rate by supplier?
    sql: |
      SELECT s.SUPPLIER_NAME, s.SUPPLIER_COUNTRY,
             COUNT(*) AS total_pos,
             AVG(CASE WHEN sc.OTIF_FLAG THEN 1 ELSE 0 END) * 100 AS otif_rate_pct
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_SUPPLY_CHAIN sc
      JOIN DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_SUPPLIER s ON sc.SUPPLIER_ID = s.SUPPLIER_ID
      GROUP BY s.SUPPLIER_NAME, s.SUPPLIER_COUNTRY
      ORDER BY otif_rate_pct ASC

  - name: verified_query_06

    question: What are the biggest demand drivers this week?
    sql: |
      SELECT
        AVG(DRIVER_WEATHER_PP) AS avg_weather_driver,
        AVG(DRIVER_PROMO_PP) AS avg_promo_driver,
        AVG(DRIVER_COMPETITOR_PP) AS avg_competitor_driver,
        AVG(DRIVER_DIGITAL_PP) AS avg_digital_driver,
        AVG(DRIVER_RESIDUAL_PP) AS avg_residual_driver
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY
      WHERE TRANSACTION_DATE >= DATEADD('day', -7, CURRENT_DATE())
        AND SCENARIO_ID IS NULL

  - name: verified_query_07

    question: Which categories have the highest lost sales revenue from stockouts?
    sql: |
      SELECT CATEGORY_L3,
             SUM(LOST_SALES_UNITS_EST) AS total_lost_units,
             SUM(LOST_SALES_UNITS_EST * REGULAR_PRICE) AS lost_revenue_est
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY
      WHERE STOCKOUT_FLAG = TRUE
        AND FISCAL_YEAR = 2026
        AND SCENARIO_ID IS NULL
      GROUP BY CATEGORY_L3
      ORDER BY lost_revenue_est DESC
      LIMIT 10

  - name: verified_query_08

    question: Show all active AI recommendations and their projected impact
    sql: |
      SELECT RECOMMENDATION_ID, SCENARIO_ID, DEPARTMENT, REGION,
             PERSONA_OWNER, ISSUE_SUMMARY, RECOMMENDED_ACTION,
             ACTION_TYPE, PROJECTED_REVENUE_IMPACT_USD,
             PROJECTED_UNITS_UPLIFT, CONFIDENCE_SCORE, URGENCY,
             GUARDRAIL_STATUS, STATUS
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_RECOMMENDATIONS
      ORDER BY ABS(PROJECTED_REVENUE_IMPACT_USD) DESC

  - name: verified_query_09

    question: What is the gross margin trend by month for Fresh & Grocery?
    sql: |
      SELECT FISCAL_MONTH,
             SUM(NET_SALES_AMT) AS net_sales,
             SUM(GROSS_MARGIN_AMT) AS gross_margin,
             (SUM(GROSS_MARGIN_AMT) / NULLIF(SUM(NET_SALES_AMT), 0)) * 100 AS gm_pct
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY
      WHERE DEPARTMENT = 'Fresh & Grocery'
        AND SCENARIO_ID IS NULL
      GROUP BY FISCAL_MONTH
      ORDER BY FISCAL_MONTH

  - name: verified_query_10

    question: What is the average days of supply by store tier and department?
    sql: |
      SELECT s.STORE_TIER, f.DEPARTMENT,
             AVG(f.DAYS_OF_SUPPLY) AS avg_dos
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY f
      JOIN DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_STORE s ON f.STORE_ID = s.STORE_ID
      WHERE f.TRANSACTION_DATE = (SELECT MAX(TRANSACTION_DATE) FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY)
        AND f.SCENARIO_ID IS NULL
      GROUP BY s.STORE_TIER, f.DEPARTMENT
      ORDER BY s.STORE_TIER, f.DEPARTMENT

  - name: verified_query_11

    question: How does the viral speaker spike scenario compare to baseline?
    sql: |
      SELECT SCENARIO_ID,
             SUM(UNITS_SOLD) AS total_units,
             SUM(NET_SALES_AMT) AS total_revenue,
             SUM(LOST_SALES_UNITS_EST) AS lost_units
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_DEMAND_DAILY
      WHERE (SCENARIO_ID = 'viral_speaker_spike' OR SCENARIO_ID IS NULL)
        AND DEPARTMENT = 'Consumer Electronics'
        AND TRANSACTION_DATE >= '2026-07-01'
      GROUP BY SCENARIO_ID

  - name: verified_query_12

    question: What are the guardrail rules and their thresholds?
    sql: |
      SELECT GUARDRAIL_ID, GUARDRAIL_NAME, SCOPE_DEPARTMENT,
             METRIC, OPERATOR, THRESHOLD_VALUE,
             ACTION_ON_BREACH, SEVERITY, ACTIVE_FLAG
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_GUARDRAILS
      WHERE ACTIVE_FLAG = TRUE
      ORDER BY SEVERITY DESC, GUARDRAIL_ID

  - name: verified_query_13

    question: What are the macro-economic conditions across regions for the latest month?
    sql: |
      SELECT REGION, MONTH_START, CPI_INDEX,
             UNEMPLOYMENT_RATE_PCT, CONSUMER_CONFIDENCE_INDEX
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_EXTERNAL_MACRO
      WHERE MONTH_START = (SELECT MAX(MONTH_START) FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_EXTERNAL_MACRO)
      ORDER BY REGION

  - name: verified_query_14

    question: Which suppliers have the highest lead time variance?
    sql: |
      SELECT s.SUPPLIER_NAME, s.SUPPLIER_COUNTRY,
             AVG(sc.LEAD_TIME_VARIANCE_DAYS) AS avg_lt_variance,
             AVG(sc.LEAD_TIME_DAYS) AS avg_lead_time,
             AVG(sc.FILL_RATE_PCT) AS avg_fill_rate
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_SUPPLY_CHAIN sc
      JOIN DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.DIM_SUPPLIER s ON sc.SUPPLIER_ID = s.SUPPLIER_ID
      GROUP BY s.SUPPLIER_NAME, s.SUPPLIER_COUNTRY
      ORDER BY avg_lt_variance DESC

  - name: verified_query_15

    question: What is the 13-week forward forecast for the West Coast region?
    sql: |
      SELECT FISCAL_WEEK, WEEK_START_DATE, HORIZON_WEEK,
             SUM(FORECAST_UNITS) AS total_forecast_units,
             SUM(FORECAST_LOWER_UNITS) AS forecast_lower,
             SUM(FORECAST_UPPER_UNITS) AS forecast_upper,
             SUM(CONSENSUS_FORECAST_UNITS) AS consensus_units
      FROM DEMANDSENSING_AI.DEMANDSENSING_SCHEMA.FACT_FORECAST
      WHERE FORECAST_TYPE = 'forward_projection'
        AND REGION = 'West Coast'
      GROUP BY FISCAL_WEEK, WEEK_START_DATE, HORIZON_WEEK
      ORDER BY HORIZON_WEEK
